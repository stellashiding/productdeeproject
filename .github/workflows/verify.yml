name: Verify workbench interactions
on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'styles.css', 'tests/**', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile UI
        run: |
          python3 -m http.server 8027 &
          node tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-screenshots
          path: screenshots
