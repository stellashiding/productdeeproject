name: Verify AI Garden and evaluation toolkit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wheel build tools
        run: python -m pip install setuptools wheel
      - name: Check JavaScript and evaluation behavior
        run: |
          npm run check
          npm test
          npm run test:harness
      - name: Package the local evaluation toolkit
        run: npm run package:harness
